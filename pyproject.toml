[project]
name = "local-lora"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "mlx-lm>=0.31.3",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
